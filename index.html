const BANK=[
{type:0,topic:'Judul karya',q:'Judul makalah manakah yang ditulis dengan tepat?',options:['Pengaruh Media Sosial Terhadap Minat Baca Remaja','Pengaruh Media Sosial terhadap Minat Baca Remaja','Pengaruh media sosial terhadap Minat Baca Remaja','Pengaruh Media Sosial terhadap minat baca remaja'],answer:1,why:'Dalam judul, kata tugas di tengah judul tetap berhuruf kecil. Pada judul ini, “terhadap” adalah kata tugas.'},
{type:0,topic:'Sapaan & kekerabatan',q:'Pilih kalimat dengan penggunaan huruf kapital yang tepat.',options:['“Apakah ibu sudah bertemu Kakak saya?” tanya Raka.','“Apakah Ibu sudah bertemu kakak saya?” tanya Raka.','“Apakah Ibu sudah bertemu Kakak Saya?” tanya Raka.','“Apakah ibu sudah bertemu kakak saya?” tanya Raka.'],answer:1,why:'“Ibu” menyapa lawan bicara. “kakak saya” menyatakan hubungan keluarga, bukan sapaan, sehingga berhuruf kecil.'},
{type:0,topic:'Nama geografi',q:'Kalimat mana yang membedakan nama tempat dan jenis dengan tepat?',options:['Kami membeli Jeruk Bali di kota Denpasar.','Kami membeli jeruk Bali di Kota denpasar.','Kami membeli jeruk bali di kota Denpasar.','Kami membeli Jeruk bali di Kota Denpasar.'],answer:2,why:'“jeruk bali” adalah nama jenis buah. “Denpasar” menunjuk tempat tertentu, sedangkan “kota” di sini hanya menyatakan kategori.'},
{type:0,topic:'Jabatan',q:'Pilih penulisan jabatan yang tepat dalam konteks ini.',options:['Rapat dipimpin oleh gubernur Jawa Tengah.','Rapat dipimpin oleh Gubernur Jawa tengah.','Rapat dipimpin oleh Gubernur Jawa Tengah.','Rapat dipimpin oleh gubernur Jawa tengah.'],answer:2,why:'“Gubernur Jawa Tengah” menunjuk pejabat tertentu melalui wilayah jabatannya. Unsur nama wilayah juga memakai kapital.'},
{type:1,topic:'Bahasa & kata turunan',q:'Apakah kalimat berikut sudah menggunakan huruf kapital dengan tepat?',sentence:'Ia belajar bahasa Inggris, tetapi tidak ingin bergaya keinggris-inggrisan.',answer:true,why:'“Inggris” merupakan nama bahasa. Pada bentuk turunan “keinggris-inggrisan”, huruf awal nama bahasa tidak lagi dikapitalkan.'},
{type:1,topic:'Petikan langsung',q:'Nilai ketepatan huruf kapital pada petikan ini.',sentence:'“Besok siang,” kata Dina, “Kami akan berdiskusi.”',answer:false,why:'Bagian “kami akan berdiskusi” melanjutkan kalimat yang sama. Sisipan pengiring “kata Dina” tidak membuat “kami” menjadi awal kalimat baru.',correct:'“Besok siang,” kata Dina, “kami akan berdiskusi.”'},
{type:1,topic:'Nama satuan',q:'Apakah penulisan huruf kapital pada kalimat ini tepat?',sentence:'Lampu itu memiliki daya 15 Watt.',answer:false,why:'Dalam konteks daya listrik, “watt” adalah satuan ukuran, bukan nama orang.',correct:'Lampu itu memiliki daya 15 watt.'},
{type:1,topic:'Nama hari',q:'Apakah kalimat berikut menggunakan huruf kapital dengan tepat?',sentence:'Diskusi kelas berlangsung setiap Jumat pada bulan Oktober.',answer:true,why:'“Jumat” dan “Oktober” masing-masing merupakan nama hari dan bulan.'},
{type:2,topic:'Geografi dalam konteks',q:'Pilih semua frasa yang ditulis dengan tepat.',prompt:'Ada dua jawaban benar. Perhatikan perbedaan nama jenis, nama tempat, dan asal daerah.',options:['batik Pekalongan','jeruk Bali','Gunung Merapi','berenang di Sungai'],answer:[0,2],why:'Pekalongan menunjukkan asal batik, sedangkan Gunung Merapi adalah nama geografis khusus. Nama jenis “jeruk bali” dan sebutan umum “sungai” memakai huruf kecil.'},
{type:2,topic:'Sapaan dalam kalimat',q:'Pilih semua kalimat yang penulisan kapitalnya tepat.',prompt:'Ada dua jawaban benar.',options:['Terima kasih atas bantuan Anda.','Besok Ibu saya pulang.','Silakan masuk, Dokter.','Adik Saya sedang belajar.'],answer:[0,2],why:'“Anda” selalu diawali kapital; “Dokter” di sini berfungsi sebagai sapaan. Pada “ibu saya” dan “adik saya”, kata kekerabatan bukan sapaan; “saya” juga bukan nama diri.'},
{type:2,topic:'Judul tulisan',q:'Pilih semua judul artikel yang penulisannya tepat.',prompt:'Ada dua jawaban benar.',options:['Dari Desa ke Panggung Dunia','Belajar dari Alam','Cerita Dari Ruang Kelas','Teknologi Dan Kehidupan Kita'],answer:[0,1],why:'Kata tugas seperti “dari”, “ke”, dan “dan” berhuruf kecil di tengah judul. “Dari” pada awal judul tetap dikapitalkan.'},
{type:2,topic:'Jabatan & gelar',q:'Pilih semua kalimat dengan penulisan kapital yang tepat.',prompt:'Ada dua jawaban benar.',options:['Wakil Presiden Mohammad Hatta dikenal sebagai tokoh bangsa.','Ia ingin menjadi seorang Presiden.','Selamat pagi, Profesor.','Ayahnya bekerja sebagai Dokter.'],answer:[0,2],why:'Jabatan yang diikuti nama dan gelar yang menjadi sapaan memakai kapital. Cita-cita atau profesi umum tidak memerlukan kapital.'},
{type:3,topic:'Nama bahasa & hari',q:'Tandai kata yang perlu diawali huruf kapital.',prompt:'Kalimat ini sengaja ditulis tanpa kapital. Pilih semua kata yang perlu diperbaiki.',words:['pada','hari','senin,','kami','belajar','bahasa','jepang.'],answer:[0,2,6],correct:'Pada hari Senin, kami belajar bahasa Jepang.',why:'Perbaikannya ada pada awal kalimat, nama hari, dan nama bahasa. Sebutan umum “hari” dan “bahasa” tetap kecil.'},
{type:3,topic:'Sapaan & nama orang',q:'Tandai kata yang perlu diawali huruf kapital.',prompt:'“bu” adalah sapaan langsung kepada lawan bicara. Pilih semua kata yang perlu diperbaiki.',words:['“terima','kasih,','bu,”','kata','ratna.'],answer:[0,2,4],correct:'“Terima kasih, Bu,” kata Ratna.',why:'Awal petikan langsung, sapaan “Bu”, dan nama Ratna perlu kapital. Kata “kata” hanya pengiring petikan.'},
{type:3,topic:'Asal daerah & nama jenis',q:'Tandai kata yang perlu diawali huruf kapital.',prompt:'Perhatikan kata yang menyatakan asal makanan dan yang merupakan nama jenis.',words:['kami','mencicipi','soto','banjar','dan','jeruk','bali.'],answer:[0,3],correct:'Kami mencicipi soto Banjar dan jeruk bali.',why:'“Banjar” menunjukkan asal soto; “jeruk bali” merupakan nama jenis. Awal kalimat juga perlu diperbaiki.'},
{type:3,topic:'Judul makalah',q:'Tandai kata yang perlu diawali huruf kapital.',prompt:'Seluruh rangkaian berikut merupakan judul makalah.',words:['peran','teknologi','dalam','pendidikan','di','indonesia'],answer:[0,1,3,5],correct:'Peran Teknologi dalam Pendidikan di Indonesia',why:'Unsur utama judul dikapitalkan, sedangkan kata tugas “dalam” dan “di” tetap kecil.'},
{type:4,topic:'Nama tempat & hari',q:'Sunting huruf kapital dalam kalimat berikut.',prompt:'Ketik ulang kalimat. Ubah hanya kapitalisasi; pertahankan kata dan tanda bacanya.',sentence:'pada hari sabtu, nabila mengunjungi Danau toba.',answer:'Pada hari Sabtu, Nabila mengunjungi Danau Toba.',why:'Awal kalimat, nama hari, nama orang, dan unsur nama “Danau Toba” perlu kapital.'},
{type:4,topic:'Sapaan & kepemilikan',q:'Perbaiki penggunaan huruf kapital pada kalimat ini.',prompt:'Ketik ulang kalimat dengan kapitalisasi yang tepat.',sentence:'“silakan duduk, pak,” kata rina kepada ayah saya.',answer:'“Silakan duduk, Pak,” kata Rina kepada ayah saya.',why:'“Pak” menyapa lawan bicara. “ayah saya” menunjukkan hubungan keluarga, sehingga tidak dikapitalkan.'},
{type:4,topic:'Judul buku',q:'Sunting kapitalisasi judul dalam kalimat berikut.',prompt:'Ketik ulang seluruh kalimat; pertahankan tanda petik dan tanda baca.',sentence:'Sinta membaca buku “Perjalanan Dari Desa Ke Kota”.',answer:'Sinta membaca buku “Perjalanan dari Desa ke Kota”.',why:'Kata tugas “dari” dan “ke” berada di tengah judul buku, sehingga ditulis kecil.'},
{type:4,topic:'Bahasa & bentuk turunan',q:'Perbaiki huruf kapital yang keliru dalam kalimat ini.',prompt:'Ketik ulang kalimat tanpa mengubah susunan katanya.',sentence:'Mereka mempelajari bahasa indonesia dan proses pengIndonesiaan istilah asing.',answer:'Mereka mempelajari bahasa Indonesia dan proses pengindonesiaan istilah asing.',why:'Nama bahasa “Indonesia” memakai kapital, tetapi bentuk turunannya “pengindonesiaan” tidak.'}
];
const app=document.getElementById('app');let questions=[],position=0,selected=[],typed='',checked=false,results=[],startTime=0;let stats={sessions:0,best:0};try{stats=JSON.parse(localStorage.getItem('kapitalStats'))||stats}catch{}let last=[];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(view){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function home(){nav('home');app.innerHTML=`<section class="hero"><div><div class="eyebrow"><span class="dot"></span> SATU HURUF, BANYAK MAKNA</div><h1>Huruf kecil,<br><em>dampak besar.</em></h1><p class="intro">Kapan harus kapital? Asah ketelitianmu lewat kuis singkat tentang huruf kapital. Lima soal, beragam tantangan, dan selalu ada hal baru untuk dipahami.</p><div class="actions"><button class="cta" id="start">Mulai latihan <span>↗</span></button><span class="tiny">± 5 menit per sesi</span></div><div class="meta"><span>✓ &nbsp;5 soal per sesi</span><span>✓ &nbsp;Level SMA</span><span>✓ &nbsp;Pembahasan langsung</span></div>${stats.sessions?`<p class="streak">${stats.sessions} sesi selesai · Nilai terbaik ${stats.best}/100</p>`:''}</div><div class="illustration" aria-label="Ilustrasi huruf A besar dan a kecil"><div class="grid"></div><span class="tag top">Ketelitian dimulai dari satu huruf.</span><div class="letters">A<span>a</span></div><span class="spark">✳</span><span class="circle"></span><span class="tag bottom">“bahasa Indonesia”, bukan “Bahasa indonesia”</span></div></section><div class="section-line"><h2>Satu sesi. Lima cara berpikir.</h2><span>Bukan sekadar memilih A, B, C.</span></div><section class="formats">${[['◉','Pilihan ganda','Temukan satu penulisan yang paling tepat.'],['⇄','Benar atau salah','Uji ketepatan kalimat dalam konteks.'],['☑','Pilih yang tepat','Ada lebih dari satu jawaban benar.'],['Aa','Tandai kata','Kenali kata yang membutuhkan kapital.'],['✎','Sunting kalimat','Perbaiki sendiri penulisan kalimat.']].map((f,i)=>`<article class="format"><span class="num">0${i+1}</span><div class="icon">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p></article>`).join('')}</section><aside class="bottom-panel"><span class="book">▤</span><div><h3>Masih tertukar antara “ibu” dan “Ibu”?</h3><p>Buka catatan ejaan, pahami polanya, lalu buktikan lewat latihan.</p></div><button class="text-link" id="open-rules">Baca catatan ejaan &nbsp; ↗</button></aside>`;document.getElementById('start').onclick=start;document.getElementById('open-rules').onclick=rules;}
function start(){questions=TYPES.map((_,t)=>{let choices=BANK.filter((q,i)=>q.type===t&&!last.includes(i));const q=choices[Math.floor(Math.random()*choices.length)];return q});last=questions.map(q=>BANK.indexOf(q));position=0;results=[];startTime=Date.now();resetQuestion();}
function resetQuestion(){selected=[];typed='';checked=false;renderQuiz();window.scrollTo(0,0)}
function renderQuiz(){nav('home');let q=questions[position];app.innerHTML=`<section class="quiz-wrap"><div class="quiz-head"><button class="back" id="leave">← Beranda</button><span class="tiny">Sesi campuran · 5 soal · Tanpa batas waktu</span></div><div class="progress" aria-label="Soal ${position+1} dari 5">${questions.map((_,i)=>`<span class="${i<=position?'done':''}"></span>`).join('')}</div><article class="quiz-card"><div class="quiz-label"><span class="pill">${TYPES[q.type]}</span><span>${q.topic}</span><span style="margin-left:auto">0${position+1} / 05</span></div><h1>${q.q}</h1><p class="prompt">${q.prompt||'Pilih jawabanmu, lalu periksa untuk melihat pembahasannya.'}</p>${q.sentence?`<div class="sentence">${escapeHTML(q.sentence)}</div>`:''}<div id="answer-area"></div><div id="feedback" aria-live="polite"></div><div class="quiz-bottom"><span class="tiny">${checked?'Satu langkah lebih paham.':'Setiap soal bernilai 20 poin.'}</span><button class="cta" id="check">Periksa jawaban <span>→</span></button></div></article><p class="notice">${q.type===4?'Kapitalisasi dinilai persis. Spasi berlebih dan bentuk tanda petik dinormalisasi.':'Kamu dapat mengubah pilihan sebelum memeriksa jawaban.'}</p></section>`;
let area=document.getElementById('answer-area');if(q.type===0||q.type===1||q.type===2){let opts=q.type===1?['Benar','Salah']:q.options;area.innerHTML=`<div class="options">${opts.map((o,i)=>`<button class="option" data-index="${i}" aria-pressed="false"><span class="key">${q.type===2?'□':String.fromCharCode(65+i)}</span>${escapeHTML(o)}</button>`).join('')}</div>`;area.querySelectorAll('button').forEach(b=>b.onclick=()=>select(Number(b.dataset.index),q.type===2))}else if(q.type===3){area.innerHTML=`<div class="words">${q.words.map((w,i)=>`<button class="word" data-index="${i}" aria-pressed="false">${escapeHTML(w)}</button>`).join('')}</div>`;area.querySelectorAll('button').forEach(b=>b.onclick=()=>select(Number(b.dataset.index),true))}else{area.innerHTML='<label class="tiny" for="rewrite">Kalimat hasil suntinganmu</label><textarea id="rewrite" placeholder="Tulis kalimat yang sudah diperbaiki…" spellcheck="false"></textarea>';document.getElementById('rewrite').oninput=e=>{typed=e.target.value;updateButton()}}
document.getElementById('check').onclick=check;document.getElementById('leave').onclick=home;updateButton()}
function select(i,multiple){if(checked)return;if(multiple){selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i]}else selected=[i];document.querySelectorAll('[data-index]').forEach(b=>{let on=selected.includes(Number(b.dataset.index));b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});updateButton()}
function updateButton(){document.getElementById('check').disabled=questions[position].type===4?!typed.trim():!selected.length}
function normalize(s){return s.normalize('NFC').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim()}
function isCorrect(q,selection,text){if(q.type===4)return normalize(text)===normalize(q.answer);if(q.type===1)return(selection[0]===0)===q.answer;if(Array.isArray(q.answer))return selection.length===q.answer.length&&q.answer.every(i=>selection.includes(i));return selection[0]===q.answer}
function answerText(q){if(q.correct)return q.correct;if(q.type===4)return q.answer;if(q.type===1)return q.answer?'Benar':'Salah';if(q.type===2)return q.answer.map(i=>q.options[i]).join(' · ');return q.options[q.answer]}
function userText(q){if(q.type===4)return typed;if(q.type===1)return selected[0]===0?'Benar':'Salah';return selected.map(i=>(q.type===3?q.words:q.options)[i]).join(' · ')}
function check(){if(checked)return;checked=true;const q=questions[position],ok=isCorrect(q,selected,typed);results.push({q,ok,user:userText(q)});document.querySelectorAll('#answer-area button,#answer-area textarea').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><strong>${ok?'✓ Tepat sekali!':'↳ Belum tepat. Mari lihat polanya.'}</strong>${q.why}<span class="correct-answer">Jawaban tepat: ${escapeHTML(answerText(q))}</span></div>`;let b=document.getElementById('check');b.innerHTML=position===4?'Lihat hasil <span>↗</span>':'Soal berikutnya <span>→</span>';b.onclick=()=>{if(position===4)finish();else{position++;resetQuestion()}}}
function finish(){const correct=results.filter(r=>r.ok).length,score=correct*20,seconds=Math.round((Date.now()-startTime)/1000);stats.sessions++;stats.best=Math.max(stats.best,score);try{localStorage.setItem('kapitalStats',JSON.stringify(stats))}catch{}app.innerHTML=`<section class="quiz-wrap result"><div class="eyebrow" style="justify-content:center"><span class="dot"></span> SESI SELESAI</div><div class="score">${score}<span> / 100</span></div><h1>${score===100?'Teliti sampai huruf terakhir.':score>=60?'Makin paham, makin percaya diri.':'Setiap koreksi adalah kemajuan.'}</h1><p class="intro" style="margin:0 auto">${correct} dari 5 soal terjawab benar dalam ${Math.floor(seconds/60)} menit ${seconds%60} detik. ${score===100?'Tantang dirimu dengan sesi baru.':'Baca ulang pembahasannya, lalu coba sesi baru.'}</p><div class="actions" style="justify-content:center"><button class="cta" id="again">Sesi baru <span>↗</span></button><button class="text-link" id="result-home" style="margin:0">Ke beranda</button></div><div class="section-line"><h2>Catatan dari sesimu</h2><span>Klik untuk membuka pembahasan</span></div><div class="summary">${results.map((r,i)=>`<details class="review" ${r.ok?'':'open'}><summary>${r.ok?'✓':'↳'} &nbsp;0${i+1} · ${r.q.topic} <span style="float:right;color:${r.ok?'#718b41':'#b37551'}">${r.ok?'20':'0'} poin</span></summary><p>${r.q.q}</p><p>Jawabanmu: ${escapeHTML(r.user)}</p><strong>Jawaban tepat: ${escapeHTML(answerText(r.q))}</strong><p>${r.q.why}</p></details>`).join('')}</div></section>`;document.getElementById('again').onclick=start;document.getElementById('result-home').onclick=home;window.scrollTo(0,0)}
function rules(){nav('rules');app.innerHTML=`<section class="quiz-wrap"><button class="back" id="rule-home">← Kembali ke latihan</button><div class="eyebrow" style="margin-top:24px"><span class="dot"></span> CATATAN EJAAN</div><h1 class="rules-title">Lihat konteksnya.<br>Temukan kapitalnya.</h1><p class="intro">Kapitalisasi bukan soal membesarkan semua kata penting. Fungsi kata di dalam kalimat menentukan penulisannya.</p><div class="rules-grid">${[['01 · Awal & petikan','Awal kalimat dan awal petikan langsung memakai kapital. Petikan lanjutan dalam satu kalimat tetap kecil.'],['02 · Nama diri','Nama orang, bahasa, hari, bulan, dan tempat khusus memakai kapital. Bentuk turunan seperti “pengindonesiaan” tetap kecil.'],['03 · Sapaan','Bedakan “Silakan, Ibu” dengan “ibu saya”. Yang pertama menyapa; yang kedua menunjukkan hubungan keluarga.'],['04 · Judul','Kapitalisasi unsur judul, kecuali kata tugas di tengahnya: “Belajar dari Alam”.'],['05 · Geografi','Bedakan tempat khusus, asal daerah, dan nama jenis: Gunung Merapi, batik Pekalongan, jeruk bali.'],['06 · Jabatan & satuan','Bedakan jabatan tertentu atau sapaan dari profesi umum. Nama orang sebagai satuan, seperti watt, ditulis kecil.']].map(r=>`<article class="rule"><h3>${r[0]}</h3><p>${r[1]}</p></article>`).join('')}</div><button class="cta" id="rules-start">Coba dalam kuis <span>↗</span></button><p class="notice">Rujukan lengkap: <a href="https://ejaan.kemendikdasmen.go.id/eyd/penggunaan-huruf/huruf-kapital/" target="_blank" rel="noopener">EYD V — Huruf Kapital ↗</a></p></section>`;document.getElementById('rule-home').onclick=home;document.getElementById('rules-start').onclick=start;window.scrollTo(0,0)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>b.dataset.view==='home'?home():rules());document.querySelector('.brand').onclick=e=>{e.preventDefault();home()};home();
</script></body></html>
